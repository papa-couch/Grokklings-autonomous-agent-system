<svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg">

  <style>

    .back  { stroke:#7d8598; stroke-width:1.3; fill:none; stroke-dasharray:5 4 }
    .rule  { stroke:#39415a; stroke-width:1 }

  <rect width="1280" height="620" fill="#000"/>

  <path class="live" d="M604 130 H 636"/>
  <path class="live" marker-end="url(#tip)" d="M636 130 V 78  Q636 70 644 70  H 700"/>
  <path class="live" marker-end="url(#tip)" d="M636 130 H 700"/>
  <path class="live" marker-end="url(#tip)" d="M636 130 V 182 Q636 190 644 190 H 700"/>
  <path class="live" d="M884 70  H 924 Q932 70 932 78 V 122"/>
  <path class="live" d="M884 130 H 932"/>

  <path class="back" marker-end="url(#tipDim)" d="M640 364 V 452"/>
  <path class="back" marker-end="url(#tipDim)" d="M1048 364 V 452"/>

  <text class="s" x="232" y="500">grades finished work against</text>
  <text class="s" x="232" y="518">criteria you wrote yourself</text>

  <text class="cap" x="64" y="580">Built in and not yours to wire: intake, the dispatcher, the journal, retries, timeouts, the stop control.</text>
  <text class="cap" x="64" y="602">Yours: the sources, the slots and what each is for, their instructions, the outputs, and what counts as done well.</text>
</svg>

<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.querySelector("svg");
const slots = document.getElementById("slots");
const add = (el, p, parent) => {
  const n = document.createElementNS(NS, el);
  for (const k in p) n.setAttribute(k, p[k]);
  (parent || svg).appendChild(n); return n;
};

// A slot is a grokkling, so each one is drawn as the little fellow from the
// banner rather than another rectangle. Small: body, two slanted eyes, grin.
function grokkling(x, y, c) {
  const INK = "#20233a", BODY = "#5d688a", FACE = "#f4f1dc";
  const px = (gx, gy, fill, w = 1, h = 1) =>
    add("rect", {x:x + gx * c, y:y + gy * c, width:c * w, height:c * h, fill}, slots);
  px(4, 0, INK, 2, 1);                 // antenna
  px(0, 1, INK, 10, 9);                // body
  px(1, 2, BODY, 8, 7);
  px(1, 10, INK, 2, 2); px(7, 10, INK, 2, 2);   // feet
  for (let gy = 2; gy <= 8; gy++)               // round face
    for (let gx = 1; gx <= 8; gx++)
      if (Math.hypot(gx + .5 - 4.9, (gy + .5 - 5.2) * 1.02) <= 3.4) px(gx, gy, FACE);
  [[3,4],[3,5],[4,3],[4,4],[6,4],[6,5],[7,3],[7,4]].forEach(([a,b]) => px(a, b, INK));
  [[3,7],[7,7],[4,8],[5,8],[6,8]].forEach(([a,b]) => px(a, b, INK));
}

const SLOT = [
  ["slot: screen", "first pass", 40],
  ["slot: dig",    "the closer look", 100],
  ["slot: draft",  "writes the result", 160],
];
SLOT.forEach(([name, sub, y]) => {
  add("rect", {x:700, y:y, width:184, height:60, class:"box"}, slots);
  grokkling(714, y + 12, 3.6);
  // A CSS class beats a presentation attribute in SVG, so the anchor has to
  // be overridden inline — as an attribute it stayed centred and the labels
  // sat on top of the robots.
  add("text", {x:766, y:y + 24, class:"t", style:"text-anchor:start"}, slots).textContent = name;
  add("text", {x:766, y:y + 42, class:"s", style:"text-anchor:start"}, slots).textContent = sub;
});
</script>
